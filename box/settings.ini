#!/system/bin/sh

# ════════════════════
# Box for Root - Файл конфигурации
# ════════════════════

# Инициализация системы: проверка busybox и установка переменных среды
if ! command -v busybox &> /dev/null; then
  export PATH="/data/adb/magisk:/data/adb/ksu/bin:/data/adb/ap/bin:$PATH:/system/bin"
fi

# ════════════════════
# Конфигурация основных путей (не изменять)
# ════════════════════

box_dir="/data/adb/box"
box_run="${box_dir}/run"
box_run_state="${box_run}/state"
box_run_locks="${box_run}/locks"

mkdir -p "${box_run_state}" "${box_run_locks}" >/dev/null 2>&1 || true

box_log="${box_run}/runs.log"
box_pid="${box_run}/box.pid"
bin_dir="${box_dir}/bin"
system_packages_file="/data/system/packages.list"
uid_list="${box_run_state}/appuid.list"

# ════════════════════
# Базовые настройки
# ════════════════════

# Автоматический запуск при включении системы
boot_auto_start="true"
current_time=$(date +"%H:%M")
box_user_group="root:net_admin"

# ════════════════════
# Конфигурация ядра прокси-сервера
# ════════════════════

bin_name="mihomo"
bin_list=("mihomo" "sing-box" "xray" "v2fly" "hysteria")
bin_path="${bin_dir}/${bin_name}"
bin_log="${box_run}/${bin_name}.log"

# Автоматическое изменение конфигурационного файла ядра при запуске
auto_modify_config="true"

# ════════════════════
# Конфигурация сети
# ════════════════════

# Сетевой режим: tun / tproxy / redirect / mixed / enhance
network_mode="tun"
tproxy_port="9898"
redir_port="9797"
ipv6="true"

quic="enable"
mihomo_dns_forward="enable"

proxy_tcp="true"
proxy_udp="true"

dns_hijack_tcp="true"
dns_hijack_udp="true"

# Политика перехвата DNS: disable / tproxy / redirect
dns_hijack_mode="tproxy"

# Обход IP-адресов материкового Китая (требуется, чтобы устройство поддерживало ipset)
bypass_cn_ip="false"
bypass_cn_ip_v4="false"
bypass_cn_ip_v6="false"
cn_ip_file="${box_run_state}/cn_ip.txt"
cn_ipv6_file="${box_run_state}/cn_ipv6.txt"
cn_ip_url="https://ispip.clang.cn/all_cn.txt"
cn_ipv6_url="https://ispip.clang.cn/all_cn_ipv6.txt"

# Черный и белый списки MAC-адресов для горячих точек (действует только для интерфейсов горячих точек/входящего трафика, по умолчанию отключено)
mac_filter="false"
mac_mode="blacklist"
macs_list=()

# ════════════════════
# Конфигурация режима прокси
# ════════════════════

# Режим прокси: blacklist (черный список) / whitelist (белый список) / core (основной режим)
proxy_mode="core"

# ════════════════════
# Управление подписками
# ════════════════════

# Массив ссылок на подписки Mihomo
subscription_url_mihomo=()
# Массив имен конфигурационных файлов подписок Mihomo
name_provide_mihomo_config=()
# Каталог хранения файлов подписки Mihomo
mihomo_provide_path="${box_dir}/mihomo/proxy_provider"

# Поддерживаются ли пользовательские правила в подписке
custom_rules_subs="false"
name_provide_mihomo_rules="rules.yaml"
mihomo_provide_rules="${box_dir}/mihomo/provide/${name_provide_mihomo_rules}"

# Ссылки на подписки Sing-box
subscription_url_singbox=""

# ════════════════════
# Управление состоянием сети
# ════════════════════

# Автоматически ли управлять службами в зависимости от состояния сети (общий переключатель)
enable_network_service_control="false"
# Включать ли модуль при подключении к Wi-Fi
use_module_on_wifi="true"
# Включать ли модуль при отключении Wi-Fi
use_module_on_wifi_disconnect="true"
# Включить ли сопоставление Wi-Fi (SSID/BSSID)
use_ssid_matching="false"
# Режим сопоставления SSID: blacklist (черный список) / whitelist (белый список)
use_wifi_list_mode="blacklist"
# Список SSID Wi-Fi
wifi_ssids_list=("WiFi1" "WiFi2")
# Список BSSID Wi-Fi
wifi_bssids_list=()
# Включить ли журнал отладки переключения сети
inotify_log_enabled="true"

# ════════════════════
# Оптимизация производительности
# ════════════════════

# Ограничение памяти
cgroup_memcg="false"
memcg_limit="100M"
# Распределение ядер ЦП
cgroup_cpuset="false"
allow_cpu="0-7"
# Вес дискового ввода-вывода
cgroup_blkio="false"
weight=""

# ════════════════════
# Путь к файлу конфигурации ядра
# ════════════════════

# Конфигурационный файл Mihomo
name_mihomo_config="config.yaml"
mihomo_config="${box_dir}/mihomo/${name_mihomo_config}"

# Конфигурационный файл Sing-box
name_sing_config="config.json"
sing_config="${box_dir}/sing-box/${name_sing_config}"

# Файл конфигурации Xray
name_xray_config="config.json"
xray_config="${box_dir}/xray/${name_xray_config}"

# Конфигурационный файл V2fly
name_v2fly_config="config.json"
v2fly_config="${box_dir}/v2fly/${name_v2fly_config}"

# Конфигурационный файл Hysteria
name_hysteria_config="config.yaml"
hysteria_config="${box_dir}/hysteria/${name_hysteria_config}"

# ════════════════════
# Автоматическое обновление конфигурации
# ════════════════════

# true: перезаписать конфигурационные файлы, false: обновить только подписки
renew="false"
# Включить ли автоматическое обновление подписок
update_subscription="false"
# Включить ли автоматическое обновление данных GeoX
update_geo="false"

# Включить ли запланированные задачи
run_crontab="false"
# Время выполнения запланированной задачи
interva_update="0 0,6,12,18 * * *"

# ════════════════════
# Настройки загрузки
# ════════════════════

# Токен доступа к GitHub
githubtoken=""
# Использовать ли зеркало для ускорения загрузки с GitHub
use_ghproxy="false"
# Адрес ускорения для зеркала
url_ghproxy="https://ghfast.top"

# Версия ядра: enable (стабильная версия) / disable (предварительная версия)
mihomo_stable="enable"
singbox_stable="enable"

# ════════════════════
# Конфигурация правил прокси (не изменять)
# ════════════════════

write_listap="${box_dir}/ap.list.cfg"
pkg_config="${box_dir}/package.list.cfg"
gid_config="${box_dir}/gid.list.cfg"
[ ! -f "${write_listap}" ] && touch "${write_listap}"
[ ! -f "${pkg_config}" ] && touch "${pkg_config}"
[ ! -f "${gid_config}" ] && touch "${gid_config}"

prefixed_list=($(sed -n '/^[0-9][0-9]*:/p' "${pkg_config}"))
unprefixed_list_converted=($(sed -n '/\./p' "${pkg_config}" | grep -v -E '^[0-9]+:|^[0-9]+$|^[[:space:]]*#' | sed 's/^/0:/'))
packages_list=("${prefixed_list[@]}" "${unprefixed_list_converted[@]}")
gid_list=($(busybox awk '!/^#/ && /^[0-9]+$/ {print $1}' "${gid_config}"))

ap_list=($(busybox awk '/^allow / {print $2}' "${write_listap}"))
ignore_ap_list=($(busybox awk '/^ignore / {print $2}' "${write_listap}"))

# ════════════════════
# Система журналов (не изменять)
# ════════════════════

log() {
  local normal="\033[0m"
  local red="\033[1;31m"
  local green="\033[1;32m"
  local yellow="\033[1;33m"
  local blue="\033[1;34m"
  local color
  
  case $1 in
    Info) color="${blue}" ;;
    Error) color="${red}" ;;
    Warning) color="${yellow}" ;;
    *) color="${green}" ;;
  esac
  
  local message="${current_time} [$1]: $2"
  
  if [ -t 1 ]; then
    echo -e "${color}${message}${normal}"
  else
    echo "${message}" | tee -a "${box_log}"
  fi
  
  if [[ $TOAST ]]; then
    true
  fi
}