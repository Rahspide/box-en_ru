#!/system/bin/sh

# ════════════════════
# Box for Root - Configuration File
# ════════════════════

# System initialization: Check busybox and set environment variables
if ! command -v busybox &> /dev/null; then
  export PATH="/data/adb/magisk:/data/adb/ksu/bin:/data/adb/ap/bin:$PATH:/system/bin"
fi

# ════════════════════
# Core path configuration (do not modify)
# ════════════════════

box_dir="/data/adb/box"
box_run="${box_dir}/run"
box_run_state="${box_run}/state"
box_run_locks="${box_run}/locks"

mkdir -p "${box_run_state}" "${box_run_locks}" >/dev/null 2>&1 || true

box_log="${box_run}/runs.log"
box_pid="${box_run}/box.pid"
bin_dir="${box_dir}/bin"
system_packages_file="/data/system/packages.list"
uid_list="${box_run_state}/appuid.list"

# ════════════════════
# Basic settings
# ════════════════════

# Auto-start on boot
boot_auto_start="true"
current_time=$(date +"%H:%M")
box_user_group="root:net_admin"

# ════════════════════
# Proxy kernel configuration
# ════════════════════

bin_name="mihomo"
bin_list=("mihomo" "sing-box" "xray" "v2fly" "hysteria")
bin_path="${bin_dir}/${bin_name}"
bin_log="${box_run}/${bin_name}.log"

# Automatically modify the kernel configuration file at startup
auto_modify_config="true"

# ════════════════════
# Network Configuration
# ════════════════════

# Network mode: tun / tproxy / redirect / mixed / enhance
network_mode="tun"
tproxy_port="9898"
redir_port="9797"
ipv6="true"

quic="enable"
mihomo_dns_forward="enable"

proxy_tcp="true"
proxy_udp="true"

dns_hijack_tcp="true"
dns_hijack_udp="true"

# DNS hijacking policy: disable / tproxy / redirect
dns_hijack_mode="tproxy"

# Bypass mainland China IPs (requires device support for ipset)
bypass_cn_ip="false"
bypass_cn_ip_v4="false"
bypass_cn_ip_v6="false"
cn_ip_file="${box_run_state}/cn_ip.txt"
cn_ipv6_file="${box_run_state}/cn_ipv6.txt"
cn_ip_url="https://ispip.clang.cn/all_cn.txt"
cn_ipv6_url="https://ispip.clang.cn/all_cn_ipv6.txt"

# MAC blacklist and whitelist for hotspot scenarios (applies only to hotspot/inbound interfaces; disabled by default)
mac_filter="false"
mac_mode="blacklist"
macs_list=()

# ════════════════════
# Proxy Mode Configuration
# ════════════════════

# Proxy mode: blacklist / whitelist / core (core mode)
proxy_mode="core"

# ════════════════════
# Subscription Management
# ════════════════════

# Array of Mihomo subscription links
subscription_url_mihomo=()
# Array of Mihomo subscription configuration file names
name_provide_mihomo_config=()
# Mihomo subscription file storage directory
mihomo_provide_path="${box_dir}/mihomo/proxy_provider"

# Whether custom rules in subscriptions are supported
custom_rules_subs="false"
name_provide_mihomo_rules="rules.yaml"
mihomo_provide_rules="${box_dir}/mihomo/provide/${name_provide_mihomo_rules}"

# Sing-box subscription link
subscription_url_singbox=""

# ════════════════════
# Network status control
# ════════════════════

# Whether to automatically control services based on network status (master on/off switch)
enable_network_service_control="false"
# Whether to enable the module when Wi-Fi is connected
use_module_on_wifi="true"
# Whether to enable the module when Wi-Fi is disconnected
use_module_on_wifi_disconnect="true"
# Whether to enable Wi-Fi matching (SSID/BSSID)
use_ssid_matching="false"
# SSID matching mode: blacklist / whitelist
use_wifi_list_mode="blacklist"
# Wi-Fi SSID list
wifi_ssids_list=("WiFi1" "WiFi2")
# Wi-Fi BSSID list
wifi_bssids_list=()
# Enable network switch debugging logs?
inotify_log_enabled="true"

# ════════════════════
# Performance optimization
# ════════════════════

# Memory limit
cgroup_memcg="false"
memcg_limit="100M"
# CPU core allocation
cgroup_cpuset="false"
allow_cpu="0-7"
# Disk I/O weight
cgroup_blkio="false"
weight=""

# ════════════════════
# Core configuration file path
# ════════════════════

# Mihomo configuration file
name_mihomo_config="config.yaml"
mihomo_config="${box_dir}/mihomo/${name_mihomo_config}"

# Sing-box configuration file
name_sing_config="config.json"
sing_config="${box_dir}/sing-box/${name_sing_config}"

# Xray configuration file
name_xray_config="config.json"
xray_config="${box_dir}/xray/${name_xray_config}"

# V2fly configuration file
name_v2fly_config="config.json"
v2fly_config="${box_dir}/v2fly/${name_v2fly_config}"

# Hysteria configuration file
name_hysteria_config="config.yaml"
hysteria_config="${box_dir}/hysteria/${name_hysteria_config}"

# ════════════════════
# Automatic configuration update
# ════════════════════

# true: Overwrite configuration files, false: Update subscriptions only
renew="false"
# Whether to enable automatic subscription updates
update_subscription="false"
# Whether to enable automatic GeoX data updates
update_geo="false"

# Whether to enable scheduled tasks
run_crontab="false"
# Scheduled task time
interva_update="0 0,6,12,18 * * *"

# ════════════════════
# Download settings
# ════════════════════

# GitHub access token
githubtoken=""
# Whether to use mirror acceleration for GitHub downloads
use_ghproxy="false"
# Mirror acceleration URL
url_ghproxy="https://ghfast.top"

# Kernel version: enable (stable) / disable (pre-release)
mihomo_stable="enable"
singbox_stable="enable"

# ════════════════════
# Proxy rule configuration (do not modify)
# ════════════════════

write_listap="${box_dir}/ap.list.cfg"
pkg_config="${box_dir}/package.list.cfg"
gid_config="${box_dir}/gid.list.cfg"
[ ! -f "${write_listap}" ] && touch "${write_listap}"
[ ! -f "${pkg_config}" ] && touch "${pkg_config}"
[ ! -f "${gid_config}" ] && touch "${gid_config}"

prefixed_list=($(sed -n '/^[0-9][0-9]*:/p' "${pkg_config}"))
unprefixed_list_converted=($(sed -n '/\./p' "${pkg_config}" | grep -v -E '^[0-9]+:|^[0-9]+$|^[[:space:]]*#' | sed 's/^/0:/'))
packages_list=("${prefixed_list[@]}" "${unprefixed_list_converted[@]}")
gid_list=($(busybox awk '!/^#/ && /^[0-9]+$/ {print $1}' "${gid_config}"))

ap_list=($(busybox awk '/^allow / {print $2}' "${write_listap}"))
ignore_ap_list=($(busybox awk '/^ignore / {print $2}' "${write_listap}"))

# ════════════════════
# Logging system (do not modify)
# ════════════════════

log() {
  local normal="\033[0m"
  local red="\033[1;31m"
  local green="\033[1;32m"
  local yellow="\033[1;33m"
  local blue="\033[1;34m"
  local color
  
  case $1 in
    Info) color="${blue}" ;;
    Error) color="${red}" ;;
    Warning) color="${yellow}" ;;
    *) color="${green}" ;;
  esac
  
  local message="${current_time} [$1]: $2"
  
  if [ -t 1 ]; then
    echo -e "${color}${message}${normal}"
  else
    echo "${message}" | tee -a "${box_log}"
  fi
  
  if [[ $TOAST ]]; then
    true
  fi
}